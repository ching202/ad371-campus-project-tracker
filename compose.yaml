name: ad371-campus-tracker

services:
  api:
    build: .
    init: true
    environment:
      PORT: 3000
      POSTGRES_URL: postgres://campus:campus_local_demo@postgres:5432/campus_tracker
      MONGODB_URL: mongodb://mongo:27017/campus_tracker
      LOG_QUERIES: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: campus_tracker
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_local_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/postgres/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./scripts/sql-checks.sql:/checks/sql-checks.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_DATABASE: campus_tracker
    volumes:
      - mongo_data:/data/db
      - ./db/mongo/001-schema.js:/docker-entrypoint-initdb.d/001-schema.js:ro
      - ./scripts/mongo-checks.js:/checks/mongo-checks.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

# The API is bound to this computer's loopback interface. Databases remain
# on the private Compose network; use compose exec for SQL/mongosh access.
volumes:
  postgres_data:
  mongo_data:
